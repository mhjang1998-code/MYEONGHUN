name: Probe voice
on:
  push:
    paths: ['scripts/probe_voice.py', '.github/workflows/probe-voice.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts==7.2.8
      - run: python scripts/probe_voice.py
      - run: curl -sI https://speech.platform.bing.com/consumer/speech/synthesize/readaloud/voices/list?trustedclienttoken=6A5AA1D4EAFF4E9FB37E23D68491D6F4 | head -5
