name: Study site

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: study-site
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.make.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install edge-tts==7.2.8
      - id: make
        env:
          STUDY_API_URL: ${{ secrets.STUDY_API_URL }}
          STUDY_API_KEY: ${{ secrets.STUDY_API_KEY }}
        run: python scripts/make_audio.py
      - if: steps.make.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/audio
          git commit -m 'Add pronunciation audio'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  deploy:
    needs: audio
    # Pages only deploys from the default branch; scheduled runs always use it.
    if: needs.audio.outputs.changed == 'true' || github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
