name: TOEIC sentences

on:
  push:
    paths: ['scripts/toeic/**', '.github/workflows/toeic-raw.yml']
  workflow_dispatch:

concurrency:
  group: toeic-raw
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -q faster-whisper==1.2.1 soundfile
      - env:
          STUDY_API_URL: ${{ secrets.STUDY_API_URL }}
          STUDY_API_KEY: ${{ secrets.STUDY_API_KEY }}
          DAYS: ''
          REDO: '1'
        run: python scripts/toeic/items.py
