<style>
#p-sum .flow{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
#p-sum .stg{border:1.5px solid var(--rule);border-top:6px solid var(--main);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
#p-sum .stg h3{margin:0;font-size:26px;color:var(--main)}
#p-sum .stg .q{font-size:19px;color:var(--note);font-weight:700;min-height:52px;line-height:1.35}
#p-sum .it{font:inherit;text-align:left;background:var(--white);border:0;border-bottom:1px solid var(--rule);padding:8px 0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
#p-sum .it:hover .t{color:var(--main)}
#p-sum .it .t{font-size:20px;font-weight:700;color:var(--deep)}
#p-sum .it .d{font-size:17px;color:var(--ink);line-height:1.35}
#p-sum .arrow{position:absolute;top:-2px;font-size:30px;color:var(--main);font-weight:700}
</style>

<section class="page" id="p-sum" data-sec="정리">
  <div class="sec rv">정리 · 전체 흐름</div>
  <h1 class="hl rv" style="--d:80ms">데이터 다듬기 → 모델 고르기 → 점수 매기기 → 이유 찾기</h1>
  <p class="sub rv" style="--d:150ms">두 논문도, 우리 캡스톤도 이 네 단계를 그대로 밟는다. 항목을 누르면 그 장으로 간다</p>

  <div class="body">
    <div class="flow rv" style="--d:250ms" id="sm-flow"></div>
  </div>

  <div class="note">각 항목의 한 줄은 그 장의 “외울 한 줄”</div>
  <div class="foot"><span>Shi et al. (2025) · Wang et al. (2024)</span><span class="pn"></span></div>

  <template data-tab="detail">
    <h4>캡스톤 체크리스트 (각 장의 인사이트 모음)</h4>
    <ol><li>논문에서 숫자를 뽑을 때 단위·기준(건물/습물)을 기록하고 먼저 통일한다.</li>
    <li>입력끼리 |r| &gt; 0.8인 쌍은 하나만 남긴다. 출력과 r이 낮다고 바로 버리지 않는다.</li>
    <li>논문 단위로 학습/시험을 나눈다. 평균·표준편차는 학습 데이터로만.</li>
    <li>RF·XGB를 주력으로, 선형 회귀를 기준선으로, KNN·신경망은 표준화 후 비교용.</li>
    <li>성능은 시험 데이터의 R²와 RMSE(원래 단위)로 말한다.</li>
    <li>SHAP 결과가 퇴비화 원리와 맞는지 확인한다. 반대면 데이터 오류부터 의심.</li></ol>
  </template>
  <template data-tab="source"><p>각 장의 출처를 따른다.</p></template>
  <template data-tab="notes"><ol><li>“기존 내용을 다 통합해서 알려 줘” 요청에 맞춘 한 장 정리.</li><li>발표 마지막 또는 중간 목차로 쓴다.</li></ol></template>
</section>

<script>
DECK.register('p-sum', root => {
  const ids = [...document.querySelectorAll('#stage .page')].map(p => p.id);
  const go = id => ids.indexOf(id) + 1;
  const S = [
    ['① 데이터 다듬기', '어떤 변수를 넣고, 어떻게 맞출까?', [
      ['p-pearson', '피어슨 r', '같이 움직이는 정도 (−1~+1)'],
      ['p-cm', '상관행렬 · 다중공선성', '입력끼리 겹치는 정보 찾기'],
      ['p-std', '표준화', '크기가 다른 열들을 같은 기준으로'],
      ['p-unit', '단위 통일', '표준화보다 먼저. 논문마다 다른 단위·기준 맞추기']]],
    ['② 모델 고르기', '어떤 방식으로 예측할까?', [
      ['p-sup', '지도학습 · 회귀 · 분류', '정답 있는 데이터. 숫자면 회귀, 종류면 분류'],
      ['p-dt', '결정 트리', '예/아니오 스무고개'],
      ['p-of', '과적합 · 일반화', '외우면 새 문제를 틀린다'],
      ['p-rf', '랜덤 포레스트', '나무 여러 그루의 평균'],
      ['p-bst', 'XGB ① 부스팅', '틀린 만큼 다음 나무가 고침 (오답노트)'],
      ['p-gd', 'XGB ② 경사하강법', '기울기 보고 한 걸음씩. 보폭 = 학습률'],
      ['p-loss', 'XGB ③ 손실함수', '틀린 정도의 벌점. 목적함수 = 손실 + 규제'],
      ['p-hp', 'XGB ⑤ 하이퍼파라미터', '학습 전에 정하는 손잡이'],
      ['p-cv', 'XGB ⑥ 교차검증', '시험 범위를 돌려 가며 평균'],
      ['p-reg', '규제 L1·L2', '복잡하면 벌점'],
      ['p-knn', 'KNN', '비슷한 이웃 k개의 다수결'],
      ['p-nn', '신경망 · 활성화 함수', '가중합 + 밝기 조절기']]],
    ['③ 점수 매기기', '얼마나 잘 맞혔나?', [
      ['p-r2', '결정계수 R²', '변화를 몇 % 설명했나 (0~1)'],
      ['p-rmse', 'RMSE', '평균 몇 점 틀렸나 (원래 단위)'],
      ['p-mr', 'MAE vs RMSE', '고르게 틀림 vs 가끔 크게 틀림'],
      ['p-rj', 'RMSE 판단 기준', '합격선 없음. 허용 오차·표준편차와 비교']]],
    ['④ 이유 찾기', '왜 그렇게 예측했나?', [
      ['p-shap', 'SHAP', '예측값을 변수별 몫으로 나누기']]]
  ];
  root.querySelector('#sm-flow').innerHTML = S.map(([h, q, items]) => `<div class="stg"><h3>${h}</h3><span class="q">${q}</span>${items.map(([id, t, d]) =>
    `<button class="it" data-goto="${go(id)}"><span class="t">${t}</span><span class="d">${d}</span></button>`).join('')}</div>`).join('');
});
</script>
