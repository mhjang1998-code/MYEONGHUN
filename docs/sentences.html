<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7faf9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="반복 듣기">
  <title>반복 듣기</title>
  <style>
    :root { font:16px -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#19262b; background:#f7faf9; color-scheme:light; }
    * { box-sizing:border-box; } body { margin:0; } [hidden] { display:none !important; }
    button,select,input { font:inherit; color:inherit; border:1px solid #cad7d3; border-radius:8px; background:#fff; min-height:44px; }
    button { padding:8px 12px; cursor:pointer; } button:disabled { opacity:.5; }
    button:focus-visible,select:focus-visible,input:focus-visible { outline:3px solid #62a99e; outline-offset:2px; }
    .app { max-width:720px; margin:auto; padding:16px 16px calc(240px + env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    h1 { font-size:21px; margin:0; } .meta { color:#607277; font-size:12px; } a { color:#176f65; }
    .tabs { display:flex; margin-top:12px; border:1px solid #cad7d3; border-radius:8px; overflow:hidden; background:#fff; }
    .tabs button { flex:1; border:0; border-radius:0; font-size:15px; font-weight:600; }
    .tabs button[aria-selected="true"] { background:#176f65; color:#fff; }
    .progress { margin:12px 0 4px; height:8px; background:#e2e9e6; border-radius:4px; overflow:hidden; } .progress div { height:100%; background:#176f65; width:0; transition:width .3s; }
    .controls { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:14px; }
    label { display:block; font-size:12px; font-weight:650; color:#4b6165; } label select,label input { margin-top:5px; width:100%; padding:8px 10px; }
    .range { display:flex; gap:8px; align-items:center; } .range input { width:100%; }
    .toggle { display:flex; align-items:center; gap:8px; min-height:44px; font-size:14px; font-weight:400; color:#19262b; } .toggle input { width:20px; min-height:20px; margin:0; accent-color:#176f65; }
    .notice { min-height:20px; margin:12px 0; font-size:13px; color:#176f65; } .error { color:#b43e36; }
    .list { margin-top:8px; border-top:1px solid #d7e0dd; }
    .row { display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid #e2e9e6; }
    .row .no { font-variant-numeric:tabular-nums; color:#607277; font-size:13px; text-align:right; }
    .row .text { text-align:left; border:0; background:transparent; padding:2px 0; min-height:44px; min-width:0; overflow-wrap:anywhere; }
    .row .en { font-size:15px; font-weight:600; color:#176f65; } .row .ko { font-size:14px; margin-top:2px; }
    .row .ex { font-size:13px; color:#4b6165; margin-top:4px; } .masked { color:#9aaaa8 !important; font-weight:400 !important; }
    .row.current { background:#edf8f2; } .row.done .en,.row.done .ko { color:#7d8f8d; text-decoration:line-through; text-decoration-color:#b9c7c4; }
    .mark { min-width:64px; font-size:13px; } .mark[aria-pressed="true"] { background:#176f65; color:#fff; border-color:#176f65; }
    .player { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid #cad7d3; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); box-shadow:0 -6px 20px rgba(25,38,43,.08); }
    .player .inner { max-width:720px; margin:auto; display:grid; gap:6px; }
    .now-main { font-size:19px; font-weight:700; overflow-wrap:anywhere; cursor:pointer; } #nowNo { cursor:pointer; } .now-sub { font-size:16px; color:#176f65; min-height:22px; overflow-wrap:anywhere; text-align:left; border:0; background:transparent; padding:0; min-height:24px; }
    .now-ex { font-size:13px; color:#4b6165; overflow-wrap:anywhere; }
    .buttons { display:grid; grid-template-columns:1fr 1fr 1.4fr 1fr; gap:8px; margin-top:4px; }
    .buttons .play { background:#176f65; color:#fff; border-color:#176f65; font-weight:700; }
    .buttons .mark-now[aria-pressed="true"] { background:#176f65; color:#fff; border-color:#176f65; }
    .setup { display:grid; gap:12px; margin:30px 0; } .setup button { background:#176f65; color:#fff; border-color:#176f65; }
    @media (min-width:600px) { .controls { grid-template-columns:repeat(4,minmax(0,1fr)); } }
  </style>
</head>
<body>
<main class="app">
  <header><div><h1 id="title">반복 듣기</h1><div class="meta" id="summary">불러오는 중</div></div><a href="./">단어장으로</a></header>
  <div class="tabs" role="tablist" aria-label="단어장" id="tabs"><button type="button" role="tab" data-deck="s300">300문장</button></div>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <div class="controls" id="controls">
    <label>들을 문장<select id="filter"><option value="left">못 외운 것만</option><option value="all">전체</option></select></label>
    <label>재생 방식<select id="mode"></select></label>
    <label>순서<select id="order"><option value="seq">순서대로</option><option value="shuffle">섞기</option></select></label>
    <label>속도<select id="rate"><option value="0.8">0.8배</option><option value="1" selected>보통</option><option value="1.2">1.2배</option></select></label>
    <label id="groupLabel" hidden>Day<select id="group"></select></label>
    <label>주차<select id="week"><option value="auto">이번 주 (자동)</option><option value="all">전체 (주차 없이)</option></select></label>
    <label id="startLabel">시작일<input id="startDate" type="date"></label>
    <label class="toggle" id="reviewLabel"><input id="review" type="checkbox" checked>지난 주 못 외운 것 포함</label>
    <label id="rangeLabel">구간<span class="range"><input id="from" type="number" min="1" inputmode="numeric" aria-label="시작 번호"> ~ <input id="to" type="number" min="1" inputmode="numeric" aria-label="끝 번호"></span></label>
    <label class="toggle"><input id="hide" type="checkbox"><span id="hideLabel">영어 가리기</span></label>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
  <div id="list" class="list"></div>
</main>
<section class="player" id="player" hidden>
  <div class="inner">
    <div class="meta" id="nowNo"></div>
    <div class="now-main" id="nowMain"></div>
    <button type="button" class="now-sub" id="nowSub"></button>
    <div class="now-ex" id="nowEx"></div>
    <div class="buttons">
      <button type="button" id="prev" aria-label="이전">⏮</button>
      <button type="button" id="next" aria-label="다음">⏭</button>
      <button type="button" id="play" class="play">▶ 재생</button>
      <button type="button" id="markNow" class="mark-now" aria-pressed="false">외움</button>
    </div>
  </div>
</section>
<audio id="audio" preload="auto" playsinline></audio>
<script src="config.js"></script>
<script>
  // main = line shown big, sub = the line hidden in practice mode; modes: [value, label, part of each item to play].
  const DECKS = {
    s300: { title: '300문장', main: 'ko', sub: 'en', hideLabel: '영어 가리기 (영작 연습)', modes: [['koen', '한국어 → 영어 2번', 'full'], ['en', '영어만', 'tail']] }
  };
  const $ = id => document.getElementById(id);
  const store = (name, value) => { try { if (value === undefined) return localStorage.getItem(name) || ''; localStorage.setItem(name, value); } catch (error) {} return ''; };
  const apiUrl = () => store('studyApiUrl') || (window.STUDY_CONFIG && STUDY_CONFIG.apiUrl) || '';
  async function api(fn, args) {
    let response;
    try { response = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: store('studyApiKey'), fn, args: args || [] }) }); }
    catch (error) { throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.'); }
    const data = await response.json().catch(() => ({ ok: false, error: '서버 응답을 읽지 못했습니다.' }));
    if (!data.ok) { const error = new Error(data.error || '요청 실패'); error.auth = data.auth === false; throw error; }
    return data.result;
  }
  function notice(text, error = false) { $('notice').textContent = text; $('notice').classList.toggle('error', error); }

  // 300문장 audio is kept on this device (IndexedDB) after the first download.
  function db() { return new Promise((resolve, reject) => { const open = indexedDB.open('study-audio', 1); open.onupgradeneeded = () => open.result.createObjectStore('files'); open.onsuccess = () => resolve(open.result); open.onerror = () => reject(open.error); }); }
  async function stored(key) { const d = await db(); return new Promise(resolve => { const r = d.transaction('files').objectStore('files').get(key); r.onsuccess = () => resolve(r.result); r.onerror = () => resolve(null); }); }
  async function keep(key, value) { const d = await db(); return new Promise(resolve => { const t = d.transaction('files', 'readwrite'); t.objectStore('files').put(value, key); t.oncomplete = t.onerror = () => resolve(); }); }
  async function audioSource(info) {
    if (info.url) return info.url;
    const key = deckId === 's300' ? 'sentences300' : 'deck:' + deckId;
    try { const saved = await stored(key); if (saved && saved.version === info.version) return URL.createObjectURL(saved.blob); } catch (error) {}
    const chunks = [];
    for (let i = 0; i < info.parts.length; i++) {
      notice('음성 받는 중 ' + (i + 1) + '/' + info.parts.length + ' · 처음 한 번만 받습니다');
      const base64 = await api('sentenceAudioPart', [info.parts[i].name]);
      const binary = atob(base64), bytes = new Uint8Array(binary.length);
      for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
      chunks.push(bytes);
    }
    const blob = new Blob(chunks, { type: 'audio/mp4' });
    try { await keep(key, { version: info.version, blob }); } catch (error) {}
    return URL.createObjectURL(blob);
  }

  let deckId = new URLSearchParams(location.search).get('deck') || store('sentenceDeck') || 's300';
  if (!DECKS[deckId]) deckId = 's300';
  const deck = () => DECKS[deckId];
  const prefKey = () => deckId === 's300' ? 'sentencePrefsV1' : 'sentencePrefsV1:' + deckId;
  let prefs = {}, loadToken = 0;
  const state = { items: [], queue: [], index: -1, current: null, revealed: new Set(), plays: {} };
  const audio = $('audio');
  function savePrefs() { store(prefKey(), JSON.stringify({ filter: $('filter').value, mode: $('mode').value, order: $('order').value, rate: $('rate').value, group: $('group').value, from: $('from').value, to: $('to').value, hide: $('hide').checked, week: $('week').value, startDate: $('startDate').value, review: $('review').checked, last: state.current ? state.current.no : prefs.last })); }
  function segment(item) {
    const mode = deck().modes.find(m => m[0] === $('mode').value) || deck().modes[0];
    return mode[2] === 'tail' ? [item.enStart, item.end] : mode[2] === 'head' ? [item.start, item.enStart] : [item.start, item.end];
  }
  // Weekly plan: 50 sentences a week counted from the start date; earlier weeks' unmemorized ones can ride along.
  const WEEK_SIZE = 50;
  const weekOf = no => Math.ceil(no / WEEK_SIZE);
  const weekCount = () => state.items.length ? weekOf(state.items[state.items.length - 1].no) : 0;
  const weekRange = w => [(w - 1) * WEEK_SIZE + 1, Math.min(w * WEEK_SIZE, state.items.length ? state.items[state.items.length - 1].no : w * WEEK_SIZE)];
  function todayKey() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function autoWeek() {
    const start = $('startDate').value; if (!start) return 1;
    const days = Math.floor((Date.parse(todayKey()) - Date.parse(start)) / 86400000);
    return Math.min(Math.max(1, weekCount()), Math.max(1, Math.floor(days / 7) + 1));
  }
  function activeWeek() { const value = $('week').value; return value === 'all' ? 0 : value === 'auto' ? autoWeek() : Number(value); }
  function weekControls() {
    const value = $('week').value, auto = value === 'auto' ? autoWeek() : 0;
    $('rangeLabel').hidden = value !== 'all'; $('startLabel').hidden = value !== 'auto'; $('reviewLabel').hidden = value === 'all';
    $('week').options[0].textContent = '이번 주 (자동' + (auto && weekCount() ? ' · ' + auto + '주차' : '') + ')';
  }
  function inRange(item) {
    const group = $('group').value; if (group && item.group !== group) return false;
    const week = activeWeek();
    if (!week) { const from = Number($('from').value) || 1, to = Number($('to').value) || Infinity; return item.no >= from && item.no <= to; }
    const own = weekOf(item.no);
    return own === week || ($('review').checked && own < week && item.state !== '외움');
  }
  const wanted = item => inRange(item) && ($('filter').value === 'all' || item.state !== '외움');
  function buildQueue() {
    const queue = state.items.filter(wanted);
    if ($('order').value === 'shuffle') for (let i = queue.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [queue[i], queue[j]] = [queue[j], queue[i]]; }
    state.queue = queue;
  }
  function buildQueueKeeping() {
    const base = $('order').value === 'shuffle' ? state.queue : state.items;
    state.queue = base.filter(item => item === state.current || wanted(item)); state.index = state.queue.indexOf(state.current);
  }
  function play(item) {
    state.current = item; state.index = state.queue.indexOf(item);
    const [start] = segment(item);
    audio.playbackRate = audio.defaultPlaybackRate = Number($('rate').value) || 1;
    if (Math.abs(audio.currentTime - start) > 0.3) audio.currentTime = start;
    audio.play().catch(() => notice('재생 버튼을 눌러 주세요.'));
    state.plays[item.no] = (state.plays[item.no] || 0) + 1;
    showNow(); savePrefs();
    if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: item.no + '. ' + item[deck().main], artist: $('hide').checked ? deck().title : item[deck().sub], album: deck().title });
  }
  // Next item; memorized ones drop out because the queue is rebuilt at every boundary and every pass.
  function next(step = 1) {
    if (!state.queue.length || state.index < 0) buildQueue();
    let index = state.index + step;
    if (index >= state.queue.length) { buildQueue(); index = 0; }
    if (index < 0) index = Math.max(0, state.queue.length - 1);
    const item = state.queue[index];
    if (!item) { audio.pause(); state.current = null; showNow(); notice('🎉 이 구간을 모두 외웠어요! "전체"로 바꾸면 다시 들을 수 있습니다.'); return; }
    state.index = index; play(item);
  }
  // The item actually under the playhead; while the screen is off iOS may play on without our boundary checks.
  const itemAt = t => state.items.find(item => t >= item.start && t < item.end);
  function syncToAudio() {
    if (audio.seeking || !state.items.length) return;
    const item = itemAt(audio.currentTime);
    if (item && item !== state.current) { state.current = item; state.index = state.queue.indexOf(item); showNow(); }
  }
  audio.addEventListener('timeupdate', () => {
    if (!state.current || audio.seeking) return;
    const [start, end] = [state.current.start, segment(state.current)[1]], t = audio.currentTime;
    if (t < start - 0.5 || t > end + 1) { syncToAudio(); return; }
    if (t >= end - 0.05) { buildQueueKeeping(); next(1); }
  });
  // Keep the list on the sentence being played, unless the user scrolled it in the last few seconds.
  let userScrolledAt = 0, shownNo = null;
  ['touchmove', 'wheel'].forEach(type => window.addEventListener(type, () => { userScrolledAt = Date.now(); }, { passive: true }));
  function scrollToCurrent(force) {
    const row = state.current && document.querySelector('[data-no="' + state.current.no + '"]');
    if (!row || document.visibilityState !== 'visible' || (!force && Date.now() - userScrolledAt < 5000)) return;
    row.scrollIntoView({ block: 'center', behavior: force ? 'auto' : 'smooth' });
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { syncToAudio(); scrollToCurrent(true); } });
  audio.addEventListener('ended', () => next(1));
  audio.addEventListener('play', () => { $('play').textContent = '⏸ 멈춤'; if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
  audio.addEventListener('pause', () => { $('play').textContent = '▶ 재생'; if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });
  if ('mediaSession' in navigator) {
    navigator.mediaSession.setActionHandler('play', () => audio.play());
    navigator.mediaSession.setActionHandler('pause', () => audio.pause());
    navigator.mediaSession.setActionHandler('nexttrack', () => next(1));
    navigator.mediaSession.setActionHandler('previoustrack', () => next(-1));
  }

  const masked = item => $('hide').checked && !state.revealed.has(item.no);
  const subText = item => masked(item) ? (deck().sub === 'en' ? '영어 보기 (눌러서 확인)' : '뜻 보기 (눌러서 확인)') : item[deck().sub];
  function showNow() {
    const item = state.current; $('player').hidden = !state.items.length;
    $('nowNo').textContent = item ? item.no + '번' + (activeWeek() ? ' · ' + weekOf(item.no) + '주차' : '') + (item.group ? ' · ' + item.group : '') + ' · ' + (item.state === '외움' ? '외움' : '못 외움') + ' · 남은 ' + state.items.filter(wanted).length + '개' : '재생할 항목을 고르거나 ▶를 누르세요';
    $('nowMain').textContent = item ? item[deck().main] : '';
    $('nowSub').textContent = item ? subText(item) : ''; $('nowSub').classList.toggle('masked', !!item && masked(item));
    $('nowEx').textContent = item && item.example ? item.example + (masked(item) ? '' : '  ' + item.exampleKo) : '';
    $('markNow').disabled = !item; $('markNow').setAttribute('aria-pressed', String(!!item && item.state === '외움'));
    $('markNow').textContent = item && item.state === '외움' ? '✓ 외움' : '외움';
    document.querySelectorAll('.row.current').forEach(row => row.classList.remove('current'));
    if (item) { const row = document.querySelector('[data-no="' + item.no + '"]'); if (row) row.classList.add('current'); }
    if (item && item.no !== shownNo) { shownNo = item.no; scrollToCurrent(false); }
  }
  function summary() {
    const done = state.items.filter(item => item.state === '외움').length, total = state.items.length;
    const week = activeWeek(), [a, b] = week ? weekRange(week) : [0, 0];
    const weekDone = week ? state.items.filter(item => weekOf(item.no) === week && item.state === '외움').length : 0;
    $('summary').textContent = '외움 ' + done + ' / ' + total + '개' + (week ? ' · ' + week + '주차(' + a + '–' + b + ') ' + weekDone + ' / ' + (b - a + 1) + '개' : ' · 남은 ' + (total - done) + '개');
    $('bar').style.width = total ? (done / total * 100) + '%' : '0';
  }
  function row(item) {
    const node = document.createElement('div'); node.className = 'row' + (item.state === '외움' ? ' done' : ''); node.dataset.no = item.no;
    const no = document.createElement('span'); no.className = 'no'; no.textContent = item.no;
    const text = document.createElement('button'); text.type = 'button'; text.className = 'text'; text.setAttribute('aria-label', item.no + '번부터 재생');
    const line = (cls, value, hide) => { const el = document.createElement('div'); el.className = cls + (hide ? ' masked' : ''); el.textContent = value; return el; };
    const hide = masked(item), mainCls = deck().main === 'en' ? 'en' : 'ko', subCls = deck().sub === 'en' ? 'en' : 'ko';
    text.append(line(mainCls, item[deck().main]), line(subCls, hide ? (deck().sub === 'en' ? '영어 가림' : '뜻 가림') : item[deck().sub], hide));
    if (item.example) text.append(line('ex', item.example + (hide ? '' : ' · ' + item.exampleKo)));
    text.addEventListener('click', () => { buildQueue(); if (!state.queue.includes(item)) state.queue.unshift(item); state.index = state.queue.indexOf(item); play(item); });
    const mark = document.createElement('button'); mark.type = 'button'; mark.className = 'mark'; mark.setAttribute('aria-pressed', String(item.state === '외움')); mark.textContent = item.state === '외움' ? '✓ 외움' : '외움';
    mark.addEventListener('click', () => toggle(item));
    node.append(no, text, mark); return node;
  }
  function render() { $('list').replaceChildren(...state.items.filter(inRange).map(row)); summary(); showNow(); }
  function refreshRow(item) { const old = document.querySelector('[data-no="' + item.no + '"]'); if (old) old.replaceWith(row(item)); summary(); showNow(); }
  async function toggle(item) {
    const before = item.state, after = before === '외움' ? '못외움' : '외움', id = deckId;
    item.state = after; refreshRow(item);
    try { const result = await api('sentenceDeckMark', [item.no, after, id]); item.memorized = result.memorized; notice(item.no + '번 ' + (after === '외움' ? '외움으로 저장 · 이제 반복에서 빠집니다' : '못 외움으로 되돌림')); }
    catch (error) { item.state = before; refreshRow(item); notice('저장하지 못했습니다: ' + error.message, true); }
  }
  async function flushPlays() {
    const counts = state.plays, id = deckId; if (!Object.keys(counts).length) return;
    state.plays = {};
    try { await api('sentenceDeckPlays', [counts, id]); } catch (error) {}
  }
  setInterval(flushPlays, 60000);
  window.addEventListener('pagehide', () => { savePrefs(); flushPlays(); });

  $('play').addEventListener('click', () => { if (!audio.paused) { audio.pause(); return; } if (state.current) audio.play(); else next(1); });
  $('next').addEventListener('click', () => next(1));
  $('prev').addEventListener('click', () => next(-1));
  $('markNow').addEventListener('click', () => state.current && toggle(state.current));
  ['nowNo', 'nowMain'].forEach(id => $(id).addEventListener('click', () => scrollToCurrent(true)));
  $('nowSub').addEventListener('click', () => { if (state.current) { state.revealed.add(state.current.no); showNow(); } });
  ['filter', 'order', 'from', 'to', 'group', 'week', 'startDate', 'review'].forEach(id => $(id).addEventListener('change', () => { weekControls(); buildQueue(); state.index = state.queue.indexOf(state.current); render(); savePrefs(); }));
  $('mode').addEventListener('change', savePrefs);
  $('rate').addEventListener('change', () => { audio.playbackRate = audio.defaultPlaybackRate = Number($('rate').value) || 1; savePrefs(); });
  $('hide').addEventListener('change', () => { state.revealed.clear(); render(); savePrefs(); });
  document.querySelectorAll('[data-deck]').forEach(tab => tab.addEventListener('click', () => {
    if (tab.dataset.deck === deckId) return;
    flushPlays(); savePrefs(); audio.pause();
    deckId = tab.dataset.deck; store('sentenceDeck', deckId); history.replaceState(null, '', '?deck=' + deckId); loadDeck();
  }));

  function setup(message) {
    $('controls').hidden = true;
    const form = document.createElement('form'); form.className = 'setup';
    form.innerHTML = '<p class="meta"></p><label>연결 키<input id="setupKey" type="password" autocomplete="off" required></label><button type="submit">연결</button>';
    form.querySelector('.meta').textContent = message || '단어장 앱과 같은 연결 키를 넣어 주세요. 이 기기에서 처음 한 번만 필요합니다.';
    form.addEventListener('submit', event => { event.preventDefault(); store('studyApiKey', form.querySelector('#setupKey').value.trim()); location.reload(); });
    $('list').replaceChildren(form);
  }
  async function loadDeck() {
    const token = ++loadToken;
    Object.assign(state, { items: [], queue: [], index: -1, current: null, plays: {} }); state.revealed.clear();
    try { prefs = JSON.parse(store(prefKey()) || '{}'); } catch (error) { prefs = {}; }
    document.title = $('title').textContent = deck().title;
    document.querySelectorAll('[data-deck]').forEach(tab => tab.setAttribute('aria-selected', String(tab.dataset.deck === deckId)));
    $('tabs').hidden = Object.keys(DECKS).length < 2;
    $('mode').replaceChildren(...deck().modes.map(([value, label]) => new Option(label, value)));
    $('hideLabel').textContent = deck().hideLabel;
    ['filter', 'mode', 'order', 'rate'].forEach(id => { if (prefs[id] && [...$(id).options].some(o => o.value === prefs[id])) $(id).value = prefs[id]; });
    $('from').value = prefs.from || ''; $('to').value = prefs.to || ''; $('hide').checked = !!prefs.hide;
    $('startDate').value = prefs.startDate || todayKey(); $('review').checked = prefs.review !== false;
    $('list').replaceChildren(); $('summary').textContent = '불러오는 중'; notice(''); $('player').hidden = true;
    if (!apiUrl() || !store('studyApiKey')) { setup(); return; }
    try {
      const data = await api('sentenceDeckLoad', [deckId]);
      if (token !== loadToken) return;
      state.items = data.items.sort((a, b) => a.no - b.no);
      const groups = [...new Set(state.items.map(item => item.group).filter(Boolean))];
      $('groupLabel').hidden = !groups.length;
      $('group').replaceChildren(new Option('전체', ''), ...groups.map(g => new Option(g, g)));
      $('group').value = groups.includes(prefs.group) ? prefs.group : '';
      $('week').replaceChildren($('week').options[0], $('week').options[1], ...Array.from({ length: weekCount() }, (_, i) => { const [a, b] = weekRange(i + 1); return new Option((i + 1) + '주차 (' + a + '–' + b + ')', String(i + 1)); }));
      $('week').value = [...$('week').options].some(o => o.value === prefs.week) ? prefs.week : 'auto';
      weekControls();
      if (!$('from').value) $('from').value = 1;
      if (!$('to').value && state.items.length) $('to').value = state.items[state.items.length - 1].no;
      render(); buildQueue();
      if (!data.audio.url && !data.audio.parts.length) { notice('음성 파일이 아직 연결되지 않았습니다.', true); return; }
      const src = await audioSource(data.audio);
      if (token !== loadToken) return;
      audio.src = src;
      notice('준비 완료 · ▶를 누르면 ' + ($('filter').value === 'left' ? '못 외운 것만' : '전체를') + ' 반복합니다. 화면을 꺼도 계속 재생됩니다.');
      const last = state.items.find(item => item.no === prefs.last);
      if (last && wanted(last)) { state.current = last; state.index = state.queue.indexOf(last); audio.currentTime = segment(last)[0]; showNow(); }
    } catch (error) { if (token !== loadToken) return; if (error.auth) setup('연결 키가 맞지 않습니다. 다시 입력해 주세요.'); else notice(error.message, true); }
  }
  loadDeck();
</script>
</body>
</html>
